  <main class="game" id="game">
    <canvas id="world" tabindex="-1" aria-label="ฉากเกมอโยธยา"></canvas>
    <div class="scene-vignette" aria-hidden="true"></div>

    <aside class="scouting" aria-label="แผนที่และภารกิจ">
      <div class="brand" aria-label="Ayothaya Survival">
        <span class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-temple"></use></svg></span>
        <div class="brand-type"><strong>Ayothaya</strong><span>Survival</span></div>
      </div>

      <section class="scouting-widget" aria-label="แผนที่ย่อ">
        <button type="button" class="scouting-toggle panel" id="minimap-toggle" data-action="toggle-scouting" data-id="minimap"
          aria-label="แผนที่ย่อ" aria-controls="minimap-panel" aria-expanded="true" title="ซ่อนแผนที่ย่อ">
          <svg class="icon scouting-toggle-icon" aria-hidden="true"><use href="#i-compass"></use></svg>
          <span>แผนที่ย่อ</span>
          <svg class="icon scouting-toggle-chevron" aria-hidden="true"><use href="#i-chevron"></use></svg>
        </button>
        <div class="minimap panel" id="minimap-panel">
          <div class="minimap-viewport">
            <canvas id="minimap" width="205" height="110" aria-hidden="true"></canvas>
          </div>
          <div class="map-caption">
            <div><h1 id="zone-name">บ้านท่ามะขาม</h1><span id="zone-range" class="zone-range">เขตชานพระนคร</span></div>
            <span id="map-coords" class="map-coords" aria-label="พิกัด"></span>
          </div>
        </div>
      </section>

      <section class="scouting-widget" id="quest-widget" aria-label="ภารกิจติดตาม">
        <button type="button" class="scouting-toggle panel" id="quest-tracker-toggle" data-action="toggle-scouting" data-id="questTracker"
          aria-label="ภารกิจติดตาม" aria-controls="quest-tracker" aria-expanded="true" title="ซ่อนภารกิจติดตาม">
          <svg class="icon scouting-toggle-icon" aria-hidden="true"><use href="#i-quest"></use></svg>
          <span>ภารกิจติดตาม</span>
          <svg class="icon scouting-toggle-chevron" aria-hidden="true"><use href="#i-chevron"></use></svg>
        </button>
        <button type="button" id="quest-tracker" class="quest-tracker panel" data-action="quests" aria-label="เปิดสมุดภารกิจ">
          <span class="quest-heading"><svg class="icon" aria-hidden="true"><use href="#i-quest"></use></svg> ภารกิจติดตาม</span>
          <strong id="quest-title">เฝ้าท่ามะขาม</strong>
          <span class="quest-detail"><span id="quest-objective">ไปพบลุงขาม</span><span id="quest-count"></span></span>
        </button>
      </section>
    </aside>

    <nav class="toolbar" aria-label="เมนูเกม">
      <div class="currency panel" aria-label="เบี้ยที่มี">
        <svg class="icon" aria-hidden="true"><use href="#i-coin"></use></svg>
        <strong id="gold">0</strong><span>เบี้ย</span>
      </div>
      <button type="button" class="menu-button panel" data-action="inventory" title="กระเป๋า (V)" aria-label="กระเป๋า (V)">
        <svg class="menu-icon" aria-hidden="true"><use href="#i-menu-bag"></use></svg><kbd>V</kbd>
      </button>
      <button type="button" class="menu-button panel" data-action="quests" title="สมุดภารกิจ (C)" aria-label="สมุดภารกิจ (C)">
        <svg class="menu-icon" aria-hidden="true"><use href="#i-menu-quests"></use></svg><kbd>C</kbd>
      </button>
      <button type="button" class="menu-button panel" data-action="character" title="ตัวละคร (B)" aria-label="ตัวละคร (B)">
        <svg class="menu-icon" aria-hidden="true"><use href="#i-menu-character"></use></svg><kbd>B</kbd>
      </button>
      <button type="button" class="menu-button panel" data-action="skills" aria-haspopup="dialog" title="เปิดหน้าต่างสกิล (K)" aria-label="เปิดหน้าต่างสกิล (K)">
        <svg class="menu-icon" aria-hidden="true"><use href="#i-menu-skills"></use></svg><kbd>K</kbd>
      </button>
      <button type="button" class="menu-button panel" data-action="fullscreen" title="เต็มจอ (F11)" aria-label="เต็มจอ (F11)">
        <svg class="menu-icon" aria-hidden="true"><use href="#i-menu-fullscreen"></use></svg><kbd>F11</kbd>
      </button>
      <button type="button" class="menu-button panel" data-action="settings" aria-haspopup="dialog" title="ตั้งค่า (Esc)" aria-label="ตั้งค่า (Esc)">
        <svg class="icon menu-icon" aria-hidden="true"><use href="#i-gear"></use></svg><kbd>ESC</kbd>
      </button>
      <button type="button" class="menu-button panel" data-action="help" title="วิธีเล่น" aria-label="วิธีเล่น">
        <svg class="menu-icon" aria-hidden="true"><use href="#i-menu-help"></use></svg>
      </button>
      <a class="menu-button panel" href="preview.html" title="พรีวิวแอนิเมชัน" aria-label="พรีวิวแอนิเมชัน">
        <svg class="menu-icon" aria-hidden="true"><use href="#i-menu-preview"></use></svg>
      </a>
      <span id="network" class="network"><span class="network-lamp" aria-hidden="true"></span><span id="network-label">เล่นคนเดียว</span></span>
    </nav>

    <div class="auto-controls panel" role="group" aria-label="เล่นอัตโนมัติ">
      <button id="auto-toggle" type="button" data-action="auto-toggle" aria-label="เปิดหรือปิด Auto" aria-pressed="false">
        <span>Auto</span><strong id="auto-state">ปิด</strong>
      </button>
      <button type="button" data-action="auto-settings" aria-label="ตั้งค่า Auto" title="ตั้งค่า Auto">
        <svg class="icon" aria-hidden="true"><use href="#i-settings"></use></svg>
      </button>
    </div>

    <div class="training-controls" id="training-controls" role="group" aria-label="กฎลานฝึก" hidden>
      <button type="button" class="training-option panel" id="training-cooldown" data-action="training-cooldown"
        aria-label="คูลดาวน์สกิลในลานฝึก" aria-pressed="true">
        <span>คูลดาวน์สกิล</span><strong id="training-cooldown-state">เปิด</strong>
      </button>
      <button type="button" class="training-option panel" id="training-mana" data-action="training-mana"
        aria-label="ใช้มานาในลานฝึก" aria-pressed="true">
        <span>ใช้มานา</span><strong id="training-mana-state">เปิด</strong>
      </button>
    </div>

    <section class="target panel" id="target" aria-label="เป้าหมายที่เลือก" hidden>
      <div class="target-label"><strong id="target-name"></strong><span id="target-level"></span></div>
      <button type="button" class="icon-button clear-target" data-action="clear-target" aria-label="ยกเลิกเป้าหมาย" title="ยกเลิกเป้าหมาย">
        <svg class="icon"><use href="#i-close"></use></svg>
      </button>
      <div class="meter meter-hp"><span id="target-hp-fill" class="meter-fill"></span><span id="target-hp-text" class="meter-text"></span></div>
      <span id="target-bleed" class="target-status" hidden>เลือดไหล</span>
      <span id="target-slow" class="target-status target-slow" hidden>ติด Slow</span>
      <div id="training-range" class="training-range" hidden>
        <span>ถึงเป้า <strong id="training-target-distance"></strong> หน่วย</span>
        <span>โจมตีปกติ <strong id="training-attack-range"></strong> หน่วย</span>
      </div>
    </section>

    <p id="interaction-hint" class="interaction-hint panel" hidden></p>
    <div id="toast" class="toast panel" role="status" aria-live="polite" hidden></div>

    <div class="controls">
      <div class="character-widget">
        <section class="status panel" aria-label="สถานะตัวละคร">
          <button type="button" class="portrait" data-action="character" title="ตัวละคร (B)" aria-label="เปิดหน้าตัวละคร">
            <span class="portrait-art" aria-hidden="true"></span>
            <span class="level-chip">Lv. <span id="base-level">1</span></span>
          </button>
          <div class="status-info">
            <div class="player-stats"><strong id="player-name">นักเดินทาง</strong><span>Job <b id="job-level">1</b></span></div>
            <div class="player-job"><span id="player-job">นักดาบฝึกหัด</span><span id="player-bleed" class="player-bleed" hidden>เลือดไหล</span></div>
            <div class="meter meter-hp" aria-label="พลังชีวิต"><span id="hp-fill" class="meter-fill"></span><span id="hp-text" class="meter-text">100 / 100</span></div>
            <div class="meter meter-sp" aria-label="มานา"><span id="sp-fill" class="meter-fill"></span><span id="sp-text" class="meter-text">50 / 50</span></div>
            <div class="meter meter-xp" aria-label="ค่าประสบการณ์"><span id="xp-fill" class="meter-fill"></span><span id="xp-text" class="meter-text">0 / 50</span></div>
          </div>
        </section>
        <span class="movement-tip"><svg class="icon"><use href="#i-cursor"></use></svg> คลิกเพื่อเดิน <span>·</span> WASD</span>
      </div>

      <section class="skill-dock" aria-label="ช่องลัดสกิล">
        <button type="button" class="skill style-blade panel" data-skill="1" title="ฟันหนัก (1)"><kbd>1</kbd><span class="skill-cooldown" aria-hidden="true"></span><svg class="skill-art" aria-hidden="true"><use href="#i-skill-heavy"></use></svg><span class="skill-label">ฟันหนัก</span></button>
        <button type="button" class="skill style-flame panel" data-skill="2" title="กวาดดาบ (2)"><kbd>2</kbd><span class="skill-cooldown" aria-hidden="true"></span><svg class="skill-art" aria-hidden="true"><use href="#i-skill-sweep"></use></svg><span class="skill-label">กวาดดาบ</span></button>
        <button type="button" class="skill style-shield panel" data-skill="3" title="กันภัย (3)"><kbd>3</kbd><span class="skill-cooldown" aria-hidden="true"></span><svg class="skill-art" aria-hidden="true"><use href="#i-skill-guard"></use></svg><span class="skill-label">กันภัย</span></button>
        <button type="button" class="skill style-leaf panel" data-skill="4" title="รักษาใจ (4)"><kbd>4</kbd><span class="skill-cooldown" aria-hidden="true"></span><svg class="skill-art" aria-hidden="true"><use href="#i-skill-heal"></use></svg><span class="skill-label">รักษาใจ</span></button>
        <button type="button" class="skill style-star panel" data-skill="5" title="พุ่งแทงใจ (5)"><kbd>5</kbd><span class="skill-cooldown" aria-hidden="true"></span><svg class="skill-art" aria-hidden="true"><use href="#i-skill-dash"></use></svg><span class="skill-label">พุ่งแทงใจ</span></button>
        <div class="item-shortcuts" role="group" aria-label="ช่องลัดไอเทม">
          <button type="button" class="item-shortcut panel" data-action="item-shortcut" data-id="1" aria-label="ช่องบน ว่าง">
            <span class="item-shortcut-icon" aria-hidden="true"></span><span class="item-shortcut-count" aria-hidden="true" hidden></span>
          </button>
          <button type="button" class="item-shortcut panel" data-action="item-shortcut" data-id="2" aria-label="ช่องล่าง ว่าง">
            <span class="item-shortcut-icon" aria-hidden="true"></span><span class="item-shortcut-count" aria-hidden="true" hidden></span>
          </button>
        </div>
      </section>

      <section class="actions" aria-label="คำสั่ง">
        <button type="button" class="action-button attack-button" data-action="attack" title="โจมตี (Space)">
          <kbd>SPACE</kbd><svg class="icon" aria-hidden="true"><use href="#i-swords"></use></svg><span>โจมตี</span>
        </button>
        <button type="button" class="action-button talk-button" data-action="talk" title="พูดคุย (F)">
          <kbd>F</kbd><svg class="icon" aria-hidden="true"><use href="#i-talk"></use></svg><span>พูดคุย</span>
        </button>
      </section>
    </div>

    <dialog id="dialog" aria-labelledby="dialog-title" class="dialog panel">
      <div class="dialog-heading">
        <span class="bag-header-emblem" aria-hidden="true"><svg class="icon"><use href="#i-bag"></use></svg></span>
        <h2 id="dialog-title"></h2>
        <button type="button" class="icon-button" id="dialog-close" data-action="close" title="ปิด (Esc)" aria-label="ปิด">
          <svg class="icon"><use href="#i-close"></use></svg>
        </button>
      </div>
      <div id="dialog-content" class="dialog-content"></div>
      <div id="bag-context" class="bag-context" role="group" aria-label="ตัวเลือกไอเทม" tabindex="-1" hidden>
        <button type="button" data-action="inventory-discard">ทิ้ง</button>
        <small id="bag-context-reason" hidden></small>
      </div>
    </dialog>
    <noscript><p class="noscript panel">เปิด JavaScript เพื่อเข้าสู่เกม Ayothaya Survival</p></noscript>
  </main>
</body>
</html>
